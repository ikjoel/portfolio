<rect x="1342" y="362" width="42" height="22" rx="4" fill="#ececec" stroke="#b5b5b5" stroke-width="1"   />
<text x="1363" y="377" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2b2b2b" text-anchor="middle">150</text>
