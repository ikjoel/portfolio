<rect x="32" y="530" width="1376" height="64" rx="4" fill="#ececec"    />
<text x="56" y="568" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#2b2b2b" text-anchor="start">No internet needed. If the licence is for another computer, it will say so and show the PC-ID to send us.</text>
</svg>
