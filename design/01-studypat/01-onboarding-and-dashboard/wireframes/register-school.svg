<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Register a school (wireframe)">
<title>Register a school (wireframe)</title>
<rect width="1440" height="900" fill="#ffffff"/>
<rect x="0" y="0" width="1440" height="76" rx="0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1"   />
<rect x="40" y="20" width="34" height="34" rx="4" fill="#d6d6d6"    />
<text x="86" y="46" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="21" font-weight="800" fill="#333333" text-anchor="start">StudyPat</text>
<text x="120" y="150" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#333333" text-anchor="start">Register your school</text>
<text x="120" y="182" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#8a8a8a" text-anchor="start">It takes about 3 minutes. No card needed.</text>
<circle cx="134" cy="232" r="14" fill="#d6d6d6" stroke="#b5b5b5" stroke-width="1"/>
<text x="134" y="237" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#2b2b2b" text-anchor="middle">1</text>
<text x="158" y="237" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#333333" text-anchor="start">School</text>
<circle cx="304" cy="232" r="14" fill="#f0f0f0" stroke="#b5b5b5" stroke-width="1"/>
<text x="304" y="237" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#8a8a8a" text-anchor="middle">2</text>
<text x="328" y="237" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#8a8a8a" text-anchor="start">You</text>
<circle cx="474" cy="232" r="14" fill="#f0f0f0" stroke="#b5b5b5" stroke-width="1"/>
<text x="474" y="237" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#8a8a8a" text-anchor="middle">3</text>
<text x="498" y="237" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#8a8a8a" text-anchor="start">Done</text>
<rect x="120" y="270" width="720" height="560" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="152" y="320" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#8a8a8a" text-anchor="start">School name</text>
<rect x="152" y="328" width="656" height="40" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="166" y="353" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">Sample Academy</text>
<text x="152" y="414" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#8a8a8a" text-anchor="start">Your school address on StudyPat</text>
<rect x="152" y="422" width="656" height="40" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="166" y="447" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">sample-academy</text>
<text x="152" y="480" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Your school will be at sample-academy.studypat.com</text>
<text x="152" y="534" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#8a8a8a" text-anchor="start">School type</text>
<rect x="152" y="542" width="316" height="40" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="166" y="567" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">Primary and secondary</text>
<text x="492" y="534" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#8a8a8a" text-anchor="start">Phone</text>
<rect x="492" y="542" width="316" height="40" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="506" y="567" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">0803 000 0000</text>
<text x="152" y="628" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#8a8a8a" text-anchor="start">Email</text>
<rect x="152" y="636" width="656" height="40" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="166" y="661" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">principal@example.com</text>
<rect x="152" y="740" width="656" height="54" rx="4" fill="#d6d6d6" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="480" y="772.6" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#2b2b2b" text-anchor="middle">Continue</text>
<text x="480" y="818" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="middle">By continuing you accept the terms and privacy notice</text>
<rect x="880" y="270" width="440" height="300" rx="4" fill="#f0f0f0" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="912" y="320" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#333333" text-anchor="start">What you get</text>
<circle cx="924" cy="366" r="8" fill="#bdbdbd" stroke="#b5b5b5" stroke-width="1"/>
<text x="944" y="372" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#333333" text-anchor="start">Free plan to start</text>
<circle cx="924" cy="410" r="8" fill="#bdbdbd" stroke="#b5b5b5" stroke-width="1"/>
<text x="944" y="416" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#333333" text-anchor="start">Parents see results on their phone</text>
<circle cx="924" cy="454" r="8" fill="#bdbdbd" stroke="#b5b5b5" stroke-width="1"/>
<text x="944" y="460" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#333333" text-anchor="start">Set up in minutes with presets</text>
<circle cx="924" cy="498" r="8" fill="#bdbdbd" stroke="#b5b5b5" stroke-width="1"/>
<text x="944" y="504" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#333333" text-anchor="start">WhatsApp help when you are stuck</text>
<circle cx="808" cy="440" r="5" fill="#c0392b"/>
<path d="M808 440 L848 484" stroke="#c0392b" stroke-width="1.2"/>
<text x="852" y="488" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#c0392b" text-anchor="start">Address preview shown as they type</text>
</svg>
