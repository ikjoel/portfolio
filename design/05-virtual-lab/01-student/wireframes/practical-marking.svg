<text x="1080" y="564" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#333333" text-anchor="end">4 / 5</text>
<rect x="360" y="578" width="720" height="10" rx="4" fill="#f0f0f0"    />
