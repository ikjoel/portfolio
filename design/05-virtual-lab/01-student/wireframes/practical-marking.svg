<text x="384" y="752" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#2b2b2b" text-anchor="start">Each student gets different hidden values,</text>
<text x="384" y="774" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#2b2b2b" text-anchor="start">so answers cannot be copied from a friend.</text>
