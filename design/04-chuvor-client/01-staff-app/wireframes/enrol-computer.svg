<text x="256" y="316" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8a" text-anchor="start">The code works once and expires in 24 hours.</text>
<text x="256" y="354" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#8a8a8a" text-anchor="start">Name of this computer</text>
