<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Company settings (mockup)">
<title>Company settings (mockup)</title><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1b1740" flood-opacity="0.09"/></filter></defs>
<rect width="1440" height="900" fill="#F4F7FB"/>
<rect x="0" y="0" width="1440" height="72" rx="0" fill="#0f2f57"    />
<text x="32" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="start">CHUVOR</text>
<text x="122" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#c9a24a" text-anchor="start">CLIENT</text>
<text x="250" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start" opacity="0.8">Sample Trading Ltd</text>
<text x="560" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#FFFFFF" text-anchor="start">Computers</text>
<text x="710" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#FFFFFF" text-anchor="start">Enrolment codes</text>
<text x="860" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="800" fill="#c9a24a" text-anchor="start">Settings</text>
<text x="1010" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#FFFFFF" text-anchor="start">Subscription</text>
<text x="32" y="126" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="28" font-weight="800" fill="#0f2f57" text-anchor="start">Settings</text>
<text x="32" y="152" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B7090" text-anchor="start">Every setting has a short explanation underneath.</text>
<rect x="32" y="180" width="700" height="330" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   filter="url(#sh)"/>
<text x="56" y="218" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#0f2f57" text-anchor="start">Your program</text>
<text x="56" y="246" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#5B7090" text-anchor="start">Name of your program</text>
<rect x="56" y="254" width="652" height="40" rx="9" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<text x="70" y="279" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">Accounting</text>
<text x="56" y="340" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#5B7090" text-anchor="start">Program to start</text>
<rect x="56" y="348" width="652" height="40" rx="9" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<text x="70" y="373" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">C:\Program Files\Accounts\accounts.exe</text>
<text x="56" y="406" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5B7090" text-anchor="start">Copy it from the program’s shortcut &gt; Properties &gt; Target.</text>
<rect x="56" y="442" width="200" height="46" rx="10" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<text x="156" y="469.725" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#0f2f57" text-anchor="middle">Test with Notepad</text>
<rect x="32" y="534" width="700" height="300" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   filter="url(#sh)"/>
<text x="56" y="572" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#0f2f57" text-anchor="start">Picture quality</text>
<rect x="56" y="606" width="652" height="60" rx="12" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<circle cx="84" cy="636" r="9" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/>
<text x="108" y="633" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#0f2f57" text-anchor="start">Speed</text>
<text x="108" y="652" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5B7090" text-anchor="start">Smoothest on a slow line</text>
<rect x="56" y="676" width="652" height="60" rx="12" fill="#E3EEF9" stroke="#2f6fb5" stroke-width="2"   />
<circle cx="84" cy="706" r="9" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/>
<circle cx="84" cy="706" r="5" fill="#0f2f57" />
<text x="108" y="703" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#0f2f57" text-anchor="start">Balanced</text>
<text x="108" y="722" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5B7090" text-anchor="start">Good for most offices</text>
<rect x="56" y="746" width="652" height="60" rx="12" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<circle cx="84" cy="776" r="9" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/>
<text x="108" y="773" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#0f2f57" text-anchor="start">Quality</text>
<text x="108" y="792" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5B7090" text-anchor="start">Sharpest picture</text>
<rect x="756" y="180" width="652" height="654" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   filter="url(#sh)"/>
<text x="780" y="218" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#0f2f57" text-anchor="start">Printing and sharing</text>
<text x="780" y="272" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0f2f57" text-anchor="start">Fast receipt and document printing</text>
<text x="780" y="294" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5B7090" text-anchor="start">Prints go straight to each person’s own printer.</text>
<rect x="1332" y="256" width="44" height="24" rx="12" fill="#0f2f57"    />
<circle cx="1364" cy="268" r="9" fill="#FFFFFF" />
<line x1="780" y1="326" x2="1384" y2="326" stroke="#E8EFF8" stroke-width="1"/>
<text x="780" y="372" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0f2f57" text-anchor="start">Allow clipboard (copy and paste)</text>
<text x="780" y="394" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5B7090" text-anchor="start">Off keeps company data in the company computer.</text>
<rect x="1332" y="356" width="44" height="24" rx="12" fill="#E8EFF8"    />
<circle cx="1344" cy="368" r="9" fill="#FFFFFF" />
<line x1="780" y1="426" x2="1384" y2="426" stroke="#E8EFF8" stroke-width="1"/>
<text x="780" y="472" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0f2f57" text-anchor="start">Allow drives and files</text>
<text x="780" y="494" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5B7090" text-anchor="start">Off stops files leaving the company computer.</text>
<rect x="1332" y="456" width="44" height="24" rx="12" fill="#E8EFF8"    />
<circle cx="1344" cy="468" r="9" fill="#FFFFFF" />
<line x1="780" y1="526" x2="1384" y2="526" stroke="#E8EFF8" stroke-width="1"/>
<text x="780" y="572" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0f2f57" text-anchor="start">Direct connection when possible</text>
<text x="780" y="594" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5B7090" text-anchor="start">Can make the screen faster. Try it on one person first.</text>
<rect x="1332" y="556" width="44" height="24" rx="12" fill="#E8EFF8"    />
<circle cx="1344" cy="568" r="9" fill="#FFFFFF" />
<line x1="780" y1="626" x2="1384" y2="626" stroke="#E8EFF8" stroke-width="1"/>
<rect x="780" y="700" width="604" height="54" rx="10" fill="#0f2f57"    />
<text x="1082" y="732.425" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Save settings</text>
</svg>
