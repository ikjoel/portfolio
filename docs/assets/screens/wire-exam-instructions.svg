<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Exam instructions (wireframe)">
<title>Exam instructions (wireframe)</title>
<rect width="1440" height="900" fill="#ffffff"/>
<rect x="0" y="0" width="1440" height="72" rx="0" fill="#e2e2e2"    />
<text x="32" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#2b2b2b" text-anchor="start">CHUVOR CBT</text>
<text x="1408" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#2b2b2b" text-anchor="end">Chinedu Obi · 2026/0143</text>
<rect x="270" y="100" width="900" height="740" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="318" y="160" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#333333" text-anchor="start">Mathematics · JSS 3 Mock</text>
<rect x="318" y="186" width="250" height="78" rx="4" fill="#f0f0f0" stroke="#b5b5b5" stroke-width="1"   />
<text x="338" y="216" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="start">Questions</text>
<text x="338" y="246" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#2b2b2b" text-anchor="start">40</text>
<rect x="588" y="186" width="250" height="78" rx="4" fill="#f0f0f0" stroke="#b5b5b5" stroke-width="1"   />
<text x="608" y="216" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="start">Time</text>
<text x="608" y="246" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#2b2b2b" text-anchor="start">60 minutes</text>
<rect x="858" y="186" width="250" height="78" rx="4" fill="#f0f0f0" stroke="#b5b5b5" stroke-width="1"   />
<text x="878" y="216" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#8a8a8a" text-anchor="start">Marks</text>
<text x="878" y="246" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#2b2b2b" text-anchor="start">40</text>
<text x="318" y="318" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#333333" text-anchor="start">Please read carefully</text>
<circle cx="326" cy="358" r="12" fill="#a8a8a8" stroke="#b5b5b5" stroke-width="1"/>
<text x="326" y="363" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#333333" text-anchor="middle">1</text>
<text x="354" y="363" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">Choose one answer for each question. Click it, and it is saved.</text>
<circle cx="326" cy="410" r="12" fill="#a8a8a8" stroke="#b5b5b5" stroke-width="1"/>
<text x="326" y="415" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#333333" text-anchor="middle">2</text>
<text x="354" y="415" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">Use Next and Previous. Flag a question to come back to it.</text>
<circle cx="326" cy="462" r="12" fill="#a8a8a8" stroke="#b5b5b5" stroke-width="1"/>
<text x="326" y="467" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#333333" text-anchor="middle">3</text>
<text x="354" y="467" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">The timer is at the top. When it ends, your exam is submitted for you.</text>
<circle cx="326" cy="514" r="12" fill="#a8a8a8" stroke="#b5b5b5" stroke-width="1"/>
<text x="326" y="519" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#333333" text-anchor="middle">4</text>
<text x="354" y="519" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">If the computer stops, tell the invigilator. Your answers are kept.</text>
<circle cx="326" cy="566" r="12" fill="#a8a8a8" stroke="#b5b5b5" stroke-width="1"/>
<text x="326" y="571" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#333333" text-anchor="middle">5</text>
<text x="354" y="571" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#333333" text-anchor="start">Do not leave the exam screen. The invigilator is told if you do.</text>
<rect x="318" y="640" width="20" height="20" rx="4" fill="#d6d6d6" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="328" y="655" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#2b2b2b" text-anchor="middle">✓</text>
<text x="350" y="656" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#333333" text-anchor="start">I have read the instructions and I am ready.</text>
<rect x="318" y="690" width="804" height="56" rx="4" fill="#a8a8a8" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="720" y="723.95" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#333333" text-anchor="middle">Start exam</text>
<circle cx="570" cy="314" r="5" fill="#c0392b"/>
<path d="M570 314 L590 314" stroke="#c0392b" stroke-width="1.2"/>
<text x="594" y="318" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#c0392b" text-anchor="start">Plain, numbered rules in everyday words</text>
</svg>
