<text x="494" y="435" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">40 of 120</text>
<text x="480" y="468" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#5B7090" text-anchor="start">Random pick, different for each candidate</text>
<text x="60" y="502" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#5B7090" text-anchor="start">Hall</text>
<rect x="60" y="510" width="260" height="40" rx="9" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<text x="74" y="535" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">Hall B (120 seats)</text>
<text x="298" y="535" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#5B7090" text-anchor="start">▾</text>
<text x="340" y="498" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#5B7090" text-anchor="start">Date</text>
<rect x="340" y="506" width="260" height="40" rx="9" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<text x="354" y="531" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">02 Dec 2026</text>
<text x="620" y="498" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#5B7090" text-anchor="start">Start time</text>
<rect x="620" y="506" width="244" height="40" rx="9" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<text x="634" y="531" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">09:00</text>
<rect x="60" y="750" width="220" height="54" rx="10" fill="#c9a24a"    />
<text x="170" y="782.25" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#0f2f57" text-anchor="middle">Save and schedule</text>
<rect x="296" y="750" width="160" height="54" rx="10" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<text x="376" y="782.25" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#0f2f57" text-anchor="middle">Cancel</text>
<rect x="920" y="176" width="456" height="660" rx="16" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   filter="url(#sh)"/>
<text x="944" y="214" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#0f2f57" text-anchor="start">Fairness options</text>
<text x="944" y="272" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">Shuffle questions for each candidate</text>
<rect x="1300" y="254" width="44" height="24" rx="12" fill="#0f2f57"    />
<circle cx="1332" cy="266" r="9" fill="#FFFFFF" />
<line x1="944" y1="294" x2="1352" y2="294" stroke="#E8EFF8" stroke-width="1"/>
<text x="944" y="338" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">Shuffle the answer options</text>
<rect x="1300" y="320" width="44" height="24" rx="12" fill="#0f2f57"    />
<circle cx="1332" cy="332" r="9" fill="#FFFFFF" />
<line x1="944" y1="360" x2="1352" y2="360" stroke="#E8EFF8" stroke-width="1"/>
<text x="944" y="404" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">Show one question at a time</text>
<rect x="1300" y="386" width="44" height="24" rx="12" fill="#0f2f57"    />
<circle cx="1332" cy="398" r="9" fill="#FFFFFF" />
<line x1="944" y1="426" x2="1352" y2="426" stroke="#E8EFF8" stroke-width="1"/>
<text x="944" y="470" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">Allow going back</text>
<rect x="1300" y="452" width="44" height="24" rx="12" fill="#0f2f57"    />
<circle cx="1332" cy="464" r="9" fill="#FFFFFF" />
<line x1="944" y1="492" x2="1352" y2="492" stroke="#E8EFF8" stroke-width="1"/>
<text x="944" y="536" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">Warn if candidate leaves the tab</text>
<rect x="1300" y="518" width="44" height="24" rx="12" fill="#0f2f57"    />
<circle cx="1332" cy="530" r="9" fill="#FFFFFF" />
<line x1="944" y1="558" x2="1352" y2="558" stroke="#E8EFF8" stroke-width="1"/>
<text x="944" y="602" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">Show the score at the end</text>
<rect x="1300" y="584" width="44" height="24" rx="12" fill="#E8EFF8"    />
<circle cx="1312" cy="596" r="9" fill="#FFFFFF" />
<line x1="944" y1="624" x2="1352" y2="624" stroke="#E8EFF8" stroke-width="1"/>
