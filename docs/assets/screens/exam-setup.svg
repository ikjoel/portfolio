<text x="870" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#FFFFFF" text-anchor="start">Results</text>
<text x="1020" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#FFFFFF" text-anchor="start">Licence</text>
<text x="1408" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="end">Exam officer ▾</text>
