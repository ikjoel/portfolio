<text x="74" y="247" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">Mathematics · JSS 3 Mock</text>
<text x="60" y="310" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#5B7090" text-anchor="start">Class</text>
<rect x="60" y="318" width="260" height="40" rx="9" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<text x="74" y="343" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">JSS 3</text>
<text x="298" y="343" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#5B7090" text-anchor="start">▾</text>
<text x="340" y="310" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#5B7090" text-anchor="start">Subject</text>
<rect x="340" y="318" width="260" height="40" rx="9" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1"   />
<text x="354" y="343" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#0f2f57" text-anchor="start">Mathematics</text>
<text x="578" y="343" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#5B7090" text-anchor="start">▾</text>
<text x="620" y="306" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#5B7090" text-anchor="start">Duration (minutes)</text>
