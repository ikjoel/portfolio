<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Sign in (wireframe)">
<title>Sign in (wireframe)</title>
<rect width="1440" height="900" fill="#ffffff"/>
<rect x="0" y="0" width="640" height="900" rx="0" fill="#d6d6d6"    />
<rect x="80" y="90" width="40" height="40" rx="4" fill="#ffffff"  opacity="0.9"  />
<text x="134" y="120" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" fill="#2b2b2b" text-anchor="start">StudyPat</text>
<text x="80" y="360" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="44" font-weight="800" fill="#2b2b2b" text-anchor="start">Welcome back.</text>
<text x="80" y="410" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#2b2b2b" text-anchor="start" opacity="0.85">Results, fees and notices for your school.</text>
<text x="800" y="200" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#333333" text-anchor="start">Sign in</text>
<text x="800" y="232" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#8a8a8a" text-anchor="start">Choose who you are</text>
<rect x="800" y="256" width="122" height="44" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1"   />
<text x="861" y="284" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#333333" text-anchor="middle">Admin</text>
<rect x="934" y="256" width="122" height="44" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1"   />
<text x="995" y="284" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#333333" text-anchor="middle">Teacher</text>
<rect x="1068" y="256" width="122" height="44" rx="4" fill="#f0f0f0" stroke="#d6d6d6" stroke-width="2"   />
<text x="1129" y="284" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#2b2b2b" text-anchor="middle">Parent</text>
<rect x="1202" y="256" width="122" height="44" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1"   />
<text x="1263" y="284" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#333333" text-anchor="middle">Student</text>
<text x="800" y="346" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#8a8a8a" text-anchor="start">Email or phone</text>
<rect x="800" y="354" width="520" height="40" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="814" y="379" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">parent@example.com</text>
<text x="800" y="440" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#8a8a8a" text-anchor="start">Password</text>
<rect x="800" y="448" width="520" height="40" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="814" y="473" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">••••••••••</text>
<text x="1320" y="540" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#2b2b2b" text-anchor="end">Forgot password?</text>
<rect x="800" y="566" width="520" height="54" rx="4" fill="#d6d6d6" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="1060" y="598.6" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="600" fill="#2b2b2b" text-anchor="middle">Sign in</text>
<line x1="800" y1="660" x2="1320" y2="660" stroke="#b5b5b5" stroke-width="1"/>
<text x="1060" y="666" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="middle">or</text>
<rect x="800" y="686" width="520" height="54" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="1060" y="718.25" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#333333" text-anchor="middle">Continue with Google</text>
<text x="800" y="790" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#2b2b2b" text-anchor="start">New school?  Register your school</text>
<circle cx="1100" cy="282" r="5" fill="#c0392b"/>
<path d="M1100 282 L1130 412" stroke="#c0392b" stroke-width="1.2"/>
<text x="1134" y="416" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#c0392b" text-anchor="start">Role picker removes a whole class of login mistakes</text>
</svg>
