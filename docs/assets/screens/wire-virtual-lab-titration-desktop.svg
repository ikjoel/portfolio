<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Virtual lab titration (desktop) (wireframe)">
<title>Virtual lab titration (desktop) (wireframe)</title>
<rect width="1440" height="900" fill="#ffffff"/>
<rect x="0" y="0" width="1440" height="72" rx="0" fill="#ffffff" stroke="#b5b5b5" stroke-width="1"   />
<text x="32" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#2b2b2b" text-anchor="start">Virtual Lab</text>
<text x="170" y="45" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#8a8a8a" text-anchor="start">Titration: HCl against NaOH · SS 2 Chemistry</text>
<rect x="1180" y="25" width="88" height="22" rx="4" fill="#ececec" stroke="#b5b5b5" stroke-width="1"   />
<text x="1224" y="40" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2b2b2b" text-anchor="middle">Time 08:24</text>
<rect x="1290" y="16" width="118" height="40" rx="4" fill="#a8a8a8" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="1349" y="40.9" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#333333" text-anchor="middle">Submit</text>
<rect x="32" y="96" width="880" height="760" rx="4" fill="#f6f6f6" stroke="#b5b5b5" stroke-width="1.5"/>
<line x1="32" y1="96" x2="912" y2="856" stroke="#cfcfcf"/><line x1="912" y1="96" x2="32" y2="856" stroke="#cfcfcf"/>
<text x="472" y="480" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="middle">3D lab viewport (Three.js, render on demand)</text>
<circle cx="472" cy="170" r="5" fill="#c0392b"/>
<path d="M472 170 L512 114" stroke="#c0392b" stroke-width="1.2"/>
<text x="516" y="118" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#c0392b" text-anchor="start">Phone-first: one scene, simple controls, a switch for older devices</text>
<rect x="936" y="96" width="472" height="330" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="964" y="134" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#333333" text-anchor="start">Steps</text>
<circle cx="978" cy="176" r="12" fill="#bdbdbd" stroke="#b5b5b5" stroke-width="1"/>
<text x="978" y="181" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#2b2b2b" text-anchor="middle">✓</text>
<text x="1002" y="181" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#333333" text-anchor="start">Rinse the burette</text>
<circle cx="978" cy="226" r="12" fill="#bdbdbd" stroke="#b5b5b5" stroke-width="1"/>
<text x="978" y="231" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#2b2b2b" text-anchor="middle">✓</text>
<text x="1002" y="231" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#333333" text-anchor="start">Fill the burette with acid</text>
<circle cx="978" cy="276" r="12" fill="#a8a8a8" stroke="#b5b5b5" stroke-width="1"/>
<text x="978" y="281" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#333333" text-anchor="middle">3</text>
<text x="1002" y="281" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#333333" text-anchor="start">Add 25 mL of base to the flask</text>
<circle cx="978" cy="326" r="12" fill="#f0f0f0" stroke="#b5b5b5" stroke-width="1"/>
<text x="978" y="331" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#333333" text-anchor="middle">4</text>
<text x="1002" y="331" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#8a8a8a" text-anchor="start">Add indicator, then titrate drop by drop</text>
<circle cx="978" cy="376" r="12" fill="#f0f0f0" stroke="#b5b5b5" stroke-width="1"/>
<text x="978" y="381" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#333333" text-anchor="middle">5</text>
<text x="1002" y="381" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="500" fill="#8a8a8a" text-anchor="start">Record the readings</text>
<rect x="936" y="446" width="472" height="410" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="964" y="484" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#333333" text-anchor="start">Controls and readings</text>
<text x="964" y="522" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#8a8a8a" text-anchor="start">Tap speed</text>
<rect x="964" y="534" width="416" height="8" rx="4" fill="#f0f0f0"    />
<rect x="964" y="534" width="150" height="8" rx="4" fill="#d6d6d6"    />
<circle cx="1114" cy="538" r="11" fill="#a8a8a8" stroke="#d6d6d6" stroke-width="2"/>
<rect x="964" y="570" width="200" height="50" rx="4" fill="#d6d6d6" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="1064" y="599.9" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#2b2b2b" text-anchor="middle">Add a drop</text>
<rect x="1180" y="570" width="200" height="50" rx="4" fill="#ffffff" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="1280" y="599.9" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#333333" text-anchor="middle">Open tap</text>
<line x1="964" y1="642" x2="1380" y2="642" stroke="#f0f0f0" stroke-width="1"/>
<text x="964" y="664" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">Initial reading</text>
<text x="1380" y="664" font-family="Consolas,monospace" font-size="15" font-weight="800" fill="#333333" text-anchor="end">0.00 mL</text>
<line x1="964" y1="686" x2="1380" y2="686" stroke="#f0f0f0" stroke-width="1"/>
<text x="964" y="708" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">Final reading</text>
<text x="1380" y="708" font-family="Consolas,monospace" font-size="15" font-weight="800" fill="#333333" text-anchor="end">—</text>
<line x1="964" y1="730" x2="1380" y2="730" stroke="#f0f0f0" stroke-width="1"/>
<text x="964" y="752" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">Volume used</text>
<text x="1380" y="752" font-family="Consolas,monospace" font-size="15" font-weight="800" fill="#333333" text-anchor="end">—</text>
<rect x="964" y="790" width="190" height="44" rx="4" fill="#f0f0f0" stroke="#b5b5b5" stroke-width="1.5"   />
<text x="1059" y="816.9" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="14" font-weight="600" fill="#333333" text-anchor="middle">💡 Hint</text>
<text x="1180" y="818" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#8a8a8a" text-anchor="start">Formulas appear after a hint</text>
</svg>
