<g transform="translate(20,664)"><line x1="0" x2="960" stroke="#e5e7eb"/><text x="0" y="24" font-size="12" fill="#1f2937">1. Colour-coded KPI cards: one accent colour per metric family so they can be scanned without reading.</text><text x="0" y="44" font-size="12" fill="#1f2937">2. Persistent sidebar, grouped by workflow (front desk / operations / revenue / admin); icon chip + label.</text><text x="0" y="64" font-size="12" fill="#1f2937">3. Branch switcher in the header — multi-property owners never leave the screen to change hotel.</text><text x="0" y="84" font-size="12" fill="#1f2937">4. Pure CSS/SVG charts — no chart library, zero extra bytes for a handful of bars.</text></g></svg>