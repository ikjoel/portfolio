<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" font-family="Segoe UI, Arial, sans-serif"><rect width="1100" height="480" fill="#fff"/>
<text x="20" y="26" font-size="17" font-weight="700" fill="#1f2937">10 · Flow: activate, transfer and disconnect</text><text x="20" y="44" font-size="12" fill="#6b7280">Goal: moving the software to a new computer is safe and self-service.</text>
<g transform="translate(20,56)"><rect x="0" y="20" width="170" height="56" rx="10" fill="#c7c9f0" stroke="#9ca3af" stroke-width="1.5" /><text x="85" y="44" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">New computer:</text><text x="85" y="60" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">enter license key</text><rect x="220" y="20" width="170" height="56" rx="10" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="305" y="44" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Server checks key</text><text x="305" y="60" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">+ 16-digit code</text><rect x="440" y="20" width="170" height="56" rx="10" fill="#d1fae5" stroke="#9ca3af" stroke-width="1.5" /><text x="525" y="44" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Free?</text><text x="525" y="60" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">bind &amp; sign proof</text><rect x="440" y="120" width="170" height="56" rx="10" fill="#fde68a" stroke="#9ca3af" stroke-width="1.5" /><text x="525" y="144" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Bound elsewhere?</text><text x="525" y="160" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">ask to transfer</text><rect x="660" y="120" width="170" height="56" rx="10" fill="#fde68a" stroke="#9ca3af" stroke-width="1.5" /><text x="745" y="144" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">User confirms</text><text x="745" y="160" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">transfer</text><rect x="660" y="20" width="170" height="56" rx="10" fill="#d1fae5" stroke="#9ca3af" stroke-width="1.5" /><text x="745" y="44" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Proof stored;</text><text x="745" y="60" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">checked offline</text><rect x="660" y="240" width="170" height="56" rx="10" fill="#fecdd3" stroke="#9ca3af" stroke-width="1.5" /><text x="745" y="264" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Old computer</text><text x="745" y="280" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">check-in → 403</text><rect x="880" y="240" width="170" height="56" rx="10" fill="#fecdd3" stroke="#9ca3af" stroke-width="1.5" /><text x="965" y="264" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Disconnected</text><text x="965" y="280" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">+ told why</text><line x1="170" y1="48" x2="220" y2="48" stroke="#1f2937" stroke-width="1.5" /><circle cx="220" cy="48" r="3.5" fill="#1f2937"/><line x1="390" y1="48" x2="440" y2="48" stroke="#1f2937" stroke-width="1.5" /><circle cx="440" cy="48" r="3.5" fill="#1f2937"/><line x1="525" y1="76" x2="525" y2="120" stroke="#1f2937" stroke-width="1.5" /><circle cx="525" cy="120" r="3.5" fill="#1f2937"/><line x1="610" y1="148" x2="660" y2="148" stroke="#1f2937" stroke-width="1.5" /><circle cx="660" cy="148" r="3.5" fill="#1f2937"/><line x1="745" y1="120" x2="745" y2="76" stroke="#1f2937" stroke-width="1.5" /><circle cx="745" cy="76" r="3.5" fill="#1f2937"/><line x1="745" y1="176" x2="745" y2="240" stroke="#1f2937" stroke-width="1.5" /><circle cx="745" cy="240" r="3.5" fill="#1f2937"/><line x1="830" y1="268" x2="880" y2="268" stroke="#1f2937" stroke-width="1.5" /><circle cx="880" cy="268" r="3.5" fill="#1f2937"/><line x1="610" y1="48" x2="660" y2="48" stroke="#1f2937" stroke-width="1.5" /><circle cx="660" cy="48" r="3.5" fill="#1f2937"/><circle cx="200" cy="70" r="11" fill="#6366f1"/><text x="200" y="74" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="520" cy="200" r="11" fill="#6366f1"/><text x="520" y="204" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="780" cy="320" r="11" fill="#6366f1"/><text x="780" y="324" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text></g>
<g transform="translate(20,404)"><line x1="0" x2="1060" stroke="#e5e7eb"/><text x="0" y="24" font-size="12" fill="#1f2937">1. Only key + code + computer name travel; never hotel data.</text><text x="0" y="44" font-size="12" fill="#1f2937">2. Transfers are limited per key (admin can reset).</text><text x="0" y="64" font-size="12" fill="#1f2937">3. The old machine keeps its data; it just loses the license.</text></g></svg>