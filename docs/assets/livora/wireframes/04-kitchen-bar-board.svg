<g transform="translate(20,544)"><line x1="0" x2="960" stroke="#e5e7eb"/><text x="0" y="24" font-size="12" fill="#1f2937">1. Status colour on the card top edge + chip: colour is never the only signal (text chip repeats it).</text><text x="0" y="44" font-size="12" fill="#1f2937">2. Allergy notes get their own highlighted row — the most safety-critical text on the card.</text><text x="0" y="64" font-size="12" fill="#1f2937">3. Board auto-refreshes every 10 s and plays a sound for new orders; kitchen/bar roles land here after sign-in.</text></g></svg>