<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="560" fill="#fff"/>
<text x="20" y="26" font-size="17" font-weight="700" fill="#1f2937">05 · Sign-in, branch picker and restore</text><text x="20" y="44" font-size="12" fill="#6b7280">Goal: one screen for sign-in, language, branch choice and disaster recovery.</text>
<g transform="translate(20,56)"><rect x="0" y="0" width="860" height="420" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><rect x="0" y="0" width="330" height="420" rx="0" fill="#c7c9f0" stroke="none" stroke-width="1.5" /><rect x="40" y="50" width="60" height="60" rx="14" fill="#6366f1" stroke="none" stroke-width="1.5" /><text x="40" y="150" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">Livora Suites</text><rect x="40" y="170" width="240" height="8" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5" /><rect x="40" y="184" width="240" height="8" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5" /><rect x="40" y="198" width="144" height="8" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5" /><rect x="40" y="240" width="200" height="8" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5" /><rect x="40" y="258" width="200" height="8" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5" /><rect x="40" y="276" width="200" height="8" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5" /><rect x="40" y="294" width="120" height="8" rx="4" fill="#e5e7eb" stroke="none" stroke-width="1.5" /><text x="380" y="70" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">Sign in</text><text x="380" y="105" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">Email</text><rect x="380" y="110" width="400" height="30" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="380" y="165" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">Password</text><rect x="380" y="170" width="400" height="30" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><rect x="380" y="220" width="400" height="30" rx="8" fill="#6366f1" stroke="#6366f1" stroke-width="1.5" /><text x="580" y="240" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Sign in</text><text x="380" y="280" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">Branch  ▾</text><rect x="380" y="285" width="400" height="30" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><rect x="380" y="340" width="150" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="392" y="359" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">Language  ▾</text><text x="380" y="400" font-size="12" font-weight="400" fill="#6366f1" text-anchor="start">Restore from a backup…</text><circle cx="790" cy="125" r="11" fill="#6366f1"/><text x="790" y="129" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="790" cy="300" r="11" fill="#6366f1"/><text x="790" y="304" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="540" cy="396" r="11" fill="#6366f1"/><text x="540" y="400" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text></g>
<g transform="translate(20,484)"><line x1="0" x2="860" stroke="#e5e7eb"/><text x="0" y="24" font-size="12" fill="#1f2937">1. Language switch re-renders the whole form instantly (17 languages, RTL for Arabic) and keeps what was typed.</text><text x="0" y="44" font-size="12" fill="#1f2937">2. Branch picker appears only when more than one branch exists.</text><text x="0" y="64" font-size="12" fill="#1f2937">3. Recovery path is on the first screen, not buried in settings — after a reformat it is the first thing needed.</text></g></svg>