eports</text><rect x="548" y="124" width="154" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="558" y="143" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">Channels</text><rect x="548" y="160" width="154" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="558" y="179" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">Exports &amp; privacy</text><rect x="720" y="0" width="170" height="40" rx="8" fill="#fecdd3" stroke="none" stroke-width="1.5" /><text x="805" y="25" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Admin</text><rect x="728" y="52" width="154" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="738" y="71" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">Messaging</text><rect x="728" y="88" width="154" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="738" y="107" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">Integrations</text><rect x="728" y="124" width="154" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="738" y="143" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">Team</text><rect x="728" y="160" width="154" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="738" y="179" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">Backup &amp; restore</text><rect x="728" y="196" width="154" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="738" y="215" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">License</text><rect x="728" y="232" width="154" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="738" y="251" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">Plans</text><rect x="728" y="268" width="154" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="738" y="287" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">Settings</text><rect x="728" y="304" width="154" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5" /><text x="738" y="323" font-size="11" font-weight="400" fill="#1f2937" text-anchor="start">Audit log</text><rect x="0" y="360" width="890" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" /><text x="14" y="382" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">Roles: owner · manager · front desk · housekeeping · accountant · waiter · kitchen · bar</text><text x="14" y="400" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">Kitchen and bar land directly on their board; housekeeping sees rooms + tasks only.</text><circle cx="870" cy="20" r="11" fill="#6366f1"/><text x="870" y="24" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text></g>
