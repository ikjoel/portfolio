<text x="20" y="26" font-size="17" font-weight="700" fill="#1f2937">09 · Information architecture (desktop app)</text><text x="20" y="44" font-size="12" fill="#6b7280">Navigation is grouped by the job the user is doing; roles only see their groups.</text>
